# Deploy merged Express site to Azure App Service (publish profile auth).
# One-time: gh secret set AZURE_WEBAPP_PUBLISH_PROFILE < /path/to/tpghelper.PublishSettings

name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and build site
        run: |
          npm ci
          npm run build:site
          test -f server/public/index.html
          test -f server/public/msba/index.html
          test -f server/public/mgm/index.html
          ls -la server/public | head -20

      - name: Stage production zip (include built public/)
        run: |
          rm -rf deploy-bundle release.zip
          mkdir -p deploy-bundle/server
          cp package.json package-lock.json deploy-bundle/
          cp server/index.js deploy-bundle/server/index.js
          # Force-copy built assets (gitignored; must not rely on git archive)
          cp -a server/public deploy-bundle/server/public
          test -f deploy-bundle/server/public/index.html
          # Stop Azure Oryx from rebuilding and dropping prebuilt public/
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' > deploy-bundle/.deployment
          cd deploy-bundle
          npm ci --omit=dev
          # Zip ourselves so nothing strips gitignored paths
          zip -r -q ../release.zip .
          cd ..
          unzip -l release.zip | head -40
          unzip -l release.zip | grep -E 'server/public/index.html|server/public/msba/index.html' 

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tpghelper
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
