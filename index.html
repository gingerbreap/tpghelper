<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HKU MSc(BA) 选课助手</title>
    <!-- Root-absolute paths; Vite rewrites them with `base` on build -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TPG Planner" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TGBLKX855E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TGBLKX855E');
    </script>
  </head>
  <body>
    <!-- Cold-start cover (PWA/Safari); removed once React mounts. -->
    <div id="tpg-boot-splash" aria-hidden="true">
      <img src="/logo.png" alt="" width="96" height="96" />
    </div>
    <style>
      #tpg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      #tpg-boot-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #tpg-boot-splash.is-done {
        display: none;
      }
    </style>
    <!--
      Lander start_url is "/". Jump to currentProgramme before React paints
      so PWA launch does not flash the auth/landing UI.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname || '/'
          if (path !== '/' && path !== '/index.html') return
          if (/programmes/i.test(location.hash || '')) return
          var id = null
          try {
            var raw = localStorage.getItem('tpghelper-site-config')
            if (raw) {
              var cfg = JSON.parse(raw)
              if (cfg && typeof cfg.currentProgramme === 'string') id = cfg.currentProgramme
            }
          } catch (e) {}
          if (!id) id = localStorage.getItem('tpghelper-preferred-programme')
          if (!id) return
          id = String(id).trim().toLowerCase()
          var map = { msba: '/msba/', mgm: '/mgm/' }
          if (id === 'msc(ba)' || id === 'ba') id = 'msba'
          var target = map[id]
          if (target) location.replace(target)
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
